name: Java CI with Maven

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [21]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Validate Maven project
        run: mvn validate

      - name: Compile project
        run: mvn clean compile

      - name: Package project
        run: mvn package -DskipTests

      - name: Verify project structure
        run: |
          echo "=== Verificando estrutura do projeto ==="
          find src/main/java -name "*.java" | head -20
          echo "=== Verificando classes compiladas ==="
          find target/classes -name "*.class" | head -20

      - name: Run specific challenges (if main methods exist)
        run: |
          echo "=== Executando desafios disponíveis ==="
          
          # Tenta executar os desafios do nível 1
          echo "--- Nível 1 ---"
          for i in {1..3}; do
            CLASS_NAME="org.cleosilva.nivel1.desafio$i.Main"
            if [ -f "target/classes/org/cleosilva/nivel1/desafio$i/Main.class" ]; then
              echo "Executando $CLASS_NAME..."
              java -cp target/classes $CLASS_NAME || echo "Erro na execução de $CLASS_NAME"
            else
              echo "Classe $CLASS_NAME não encontrada, tentando outras variações..."
              # Tenta encontrar a classe principal do desafio
              MAIN_CLASS=$(find target/classes/org/cleosilva/nivel1/desafio$i -name "*.class" | head -1)
              if [ ! -z "$MAIN_CLASS" ]; then
                CLASS_PATH=$(echo $MAIN_CLASS | sed 's|target/classes/||' | sed 's|/|.|g' | sed 's|.class||')
                echo "Tentando executar $CLASS_PATH..."
                java -cp target/classes $CLASS_PATH || echo "Erro na execução de $CLASS_PATH"
              fi
            fi
          done
          
          # Tenta executar os desafios do nível 2
          echo "--- Nível 2 ---"
          for i in {1..2}; do
            CLASS_NAME="org.cleosilva.nivel2.desafio$i.Main"
            if [ -f "target/classes/org/cleosilva/nivel2/desafio$i/Main.class" ]; then
              echo "Executando $CLASS_NAME..."
              java -cp target/classes $CLASS_NAME || echo "Erro na execução de $CLASS_NAME"
            else
              echo "Classe $CLASS_NAME não encontrada, tentando outras variações..."
              # Tenta encontrar a classe principal do desafio
              MAIN_CLASS=$(find target/classes/org/cleosilva/nivel2/desafio$i -name "*.class" | head -1)
              if [ ! -z "$MAIN_CLASS" ]; then
                CLASS_PATH=$(echo $MAIN_CLASS | sed 's|target/classes/||' | sed 's|/|.|g' | sed 's|.class||')
                echo "Tentando executar $CLASS_PATH..."
                java -cp target/classes $CLASS_PATH || echo "Erro na execução de $CLASS_PATH"
              fi
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts-java-21
          path: |
            target/*.jar
            target/classes/
          retention-days: 5

      - name: Notify on success
        if: success()
        run: echo "✅ Build realizado com sucesso!"

  code-quality:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Check code style with Checkstyle
        run: |
          mvn compile
          echo "=== Verificando estilo do código ==="
          find src/main/java -name "*.java" -exec wc -l {} + | sort -n
          echo "=== Estrutura de pacotes ==="
          find src/main/java -type d | sort